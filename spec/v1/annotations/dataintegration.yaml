$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://sap.github.io/csn-interop-specification/spec-v1/dataintegration.schema.json#"
title: DataIntegration Document
description: This is the interface description of @DataIntegration.
type: object
definitions:
  "@DataIntegration.dataUnavailable":
    type: boolean
    description: |-
      Specifies that the data of the element or entity is unavailable although it is part of the output structure.
    x-extension-targets:
      - Type
      - Entity

  "@DataIntegration.dataProduct.customDataProvider.partialKeyDefinition":
    type: array
    description: |-
      Defines subset of key fields of the CDS entity used for DELETE operation during delta replication.

      **Consistency Constraints:**
      - Must be used together with `@DataIntegration.dataProduct.customDataProvider.implementedBy` annotation.
      - Fields defined in the annotation must be key fields of the CDS entity.
    items:
      x-ref-to-doc:
        title: Element Reference
        ref: "#/definitions/ElementReference"
    minItems: 1
    x-extension-targets:
      - "Entity"
    examples:
      - ["AirlineCode", "FlightConnectionNumber", "FlightDate"]
