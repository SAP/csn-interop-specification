$schema: "http://json-schema.org/draft-07/schema#"
$id: "https://sap.github.io/csn-interop-specification/spec-v1/dataintegration.schema.json#"
title: DataIntegration Document
description: This is the interface description of @DataIntegration.
type: object
definitions:
  "@DataIntegration.dataUnavailable":
    type: boolean
    description: |-
      Specifies that the data of the element or entity is unavailable although it is part of the output structure.
    x-extension-targets:
      - Type
      - Entity
  "@DataIntegration.technical":
    type: boolean
    const: true
    description: |-
      Express by this annotation that an element is of technical nature used for data integration purposes and does not belong to the business data of the data product.
    x-extension-targets:
      - Type
    x-introduced-in-version: 1.2.6
