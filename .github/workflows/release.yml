name: Release
on:
  workflow_dispatch:
    inputs:
      npm:
        description: "NPMJS Package"
        required: false
        type: boolean
        default: true
      githubRelease:
        description: "GitHub Release"
        required: false
        type: boolean
        default: true
permissions:
  contents: read

jobs:
  npm:
    if: |-
      github.ref == 'refs/heads/main' && (
      inputs.npm
      )
    runs-on: ubuntu-latest
    environment: npmjs:@sap/csn-interop-specification
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          # registry-url is required for releasing packages
          registry-url: ${{ vars.NPM_REGISTRY }}

          package-manager-cache: false
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to NPM
        # --access public is only hard required for the initial release, but it doesn't hurt having it setup
        run: npm publish --access public

  githubRelease:
    needs: [npm]
    if: |-
      github.ref == 'refs/heads/main' && (
      always() &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'failure') &&
      inputs.githubRelease
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
      statuses: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

          persist-credentials: true # Needed by the release/push step
      - name: Create GitHub Release
        uses: open-resource-discovery/github-release@2d8817b7382966b490d5c78125d97da14ee918bc # main @ 2026-11-14
