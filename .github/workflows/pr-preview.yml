name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

jobs:
  pr-preview:
    permissions:
      contents: write
      actions: write
      pull-requests: read

    runs-on: ubuntu-latest

    concurrency:
      group: preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - name: Build preview
        if: github.event.action != 'closed'
        env:
          PR_PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          BASE_URL: /csn-interop-pr-preview/csn-interop-specification/pr-${{ github.event.pull_request.number }}/
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: PR preview
        uses: open-resource-discovery/pr-preview-action@2abf52396925f6bb4d0a82e27bd6f060260d09ae # main @ 2026-04-30
        with:
          fork: true
          target-repo: SAP/csn-interop-pr-preview
          pages-base-url: https://sap.github.io/csn-interop-pr-preview
          umbrella-dir: csn-interop-specification
          token: ${{ secrets.PR_PREVIEW_TOKEN }}
