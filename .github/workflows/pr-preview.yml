name: PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  pr-preview:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    concurrency:
      group: preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      - name: Build preview
        if: github.event.action != 'closed'
        env:
          PR_PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
          BASE_URL: /csn-interop-pr-preview/csn-interop-specification/pr-${{ github.event.pull_request.number }}/
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: PR preview
        uses: open-resource-discovery/pr-preview-action@d4998f1ebe4699cedac6673d47c1edb0c6c73405 # main
        with:
          fork: false
          target-repo: SAP/csn-interop-pr-preview
          pages-base-url: https://sap.github.io/csn-interop-pr-preview
          umbrella-dir: csn-interop-specification
          token: ${{ secrets.PR_PREVIEW_TOKEN }}
          wait-poll-attempts: 180
    if: github.event.pull_request.head.repo.full_name == github.repository
